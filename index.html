<script type="text/samse" id="doc:man">
SAMSESH(1)                   User Commands                    SAMSESH(1)

NAME
       samsesh - DevSecOps & cybersecurity researcher, at a prompt

SYNOPSIS
       <command> [args]     everything here is a command. Tab completes.

DESCRIPTION
       Sam Sesh's business card, wearing a terminal costume. One HTML
       file, no build step, honest localStorage. Log in, type one
       command, know one person. the prompt host is your own public
       ip, resolved live — the terminal knows who's asking. and from
       a real terminal, 'curl samsesh.net' says hello before the
       source begins.

GETTING IN
       samsesh login:    any name works; Enter alone makes you 'guest'.
                         no password is asked — we trust you (bravely)
       login as 'root'   if you want the # prompt and the attitude

COMMANDS
       cat info.txt      everything about me, in one file. start here
       info              alias for 'cat ~/info.txt' — same card, lazier
       ls [dir]          list what little there is (ls -l for dates)
       cat <file>        read a file
       social            just the socials
       contact           email & phone
       donate            the coffee fund — opens donate.samsesh.net
       telegram          open t.me/sam_sesh
       mail [addr]       compose a message; end the body with '.'
       curl [url]        your ip + geo info, live from ifconfig.co
       neofetch          the system card. pure flex.
       hostname          your ip, actually — that's the host now
       login             switch user without closing the tab
       logout, exit      end the session — the login prompt returns
       theme [name]      linux | ubuntu | green | amber | mono
       crt [on|off]      scanlines, phosphor bloom, mild nostalgia
       sound [on|off]    opt-in keypress audio, extremely subtle
       history           everything you've typed here
       uptime            load average, honestly
       clear             wipe scrollback (Ctrl+L works too)

KEYS
       Tab              accept the grey ghost completion
       Up / Down        walk command history
       Left / Right     move the cursor inside the line
       Home / End       jump to start / end of line
       Ctrl+C           cancel line
       Ctrl+D           end the session on an empty line
       Ctrl+U           wipe line     Ctrl+L   clear screen

FILES
       ~/info.txt        the whole site, honestly — 'info' is an alias
                         for catting this exact file
       ~/.plan           current status, finger-style
       ~/.zshrc          a config file with nothing to prove

EXAMPLES
       cat info.txt
       info
       curl ifconfig.co
       mail admin@samsesh.net

SEE ALSO
       cat(1), mail(1), curl(1), your muscle memory

BUGS
       None. Features.

samsesh.net 3.2.1                       June 2025                     SAMSESH(1)

/* ── tiny markdown renderer (dormant — wakes up if posts return) ─────── */
function inline(s){
  s = esc(s);
  const codes=[];
  s = s.replace(/`([^`]+)`/g, (_,c)=>{ codes.push(c); return '\x00'+(codes.length-1)+'\x00'; });
  s = s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s = s.replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,'$1<i>$2</i>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
    (_,t,u)=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  s = s.replace(/\x00(\d+)\x00/g, (_,n)=>`<span class="ic">${codes[n]}</span>`);
  return s;
}
function renderMD(src){
  const lines = src.split('\n'); const html=[]; let para=[], i=0;
  const flush = ()=>{ if(para.length){ html.push('<p>'+inline(para.join(' '))+'</p>'); para=[]; } };
  while(i<lines.length){
    const L=lines[i];
    if(/^(~~~|```)/.test(L)){ flush(); const buf=[]; i++;
      while(i<lines.length && !/^(~~~|```)/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++; html.push('<pre class="code">'+esc(buf.join('\n'))+'</pre>'); continue; }
    const h=L.match(/^(#{1,6})\s+(.*)/);
    if(h){ flush(); const lv=Math.min(h[1].length,4);
      html.push(`<h${lv}>`+inline(h[2])+`</h${lv}>`); i++; continue; }
    if(/^(---+|\*\*\*+)\s*$/.test(L)){ flush(); html.push('<div class="hr"></div>'); i++; continue; }
    if(/^>\s?/.test(L)){ flush(); const buf=[];
      while(i<lines.length && /^>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^>\s?/,'')); i++; }
      html.push('<blockquote>'+inline(buf.join(' '))+'</blockquote>'); continue; }
    if(/^([-*]|\d+\.)\s+/.test(L)){ flush(); const ol=/^\d+\./.test(L), items=[];
      while(i<lines.length && /^([-*]|\d+\.)\s+/.test(lines[i])){
        items.push(lines[i].replace(/^([-*]|\d+\.)\s+/,'')); i++; }
      html.push((ol?'<ol>':'<ul>')+items.map(t=>'<li>'+inline(t)+'</li>').join('')+(ol?'</ol>':'</ul>')); continue; }
    if(/^\s*$/.test(L)){ flush(); i++; continue; }
    para.push(L.trim()); i++;
  }
  flush();
  return html.join('');
}

/* ── virtual filesystem ──────────────────────────────────────────────── */
let USER='guest', cwd=[], prevCwd=null;
const pathStr  = s => s.length ? '~/'+s.join('/') : '~';
const HOMEABS  = () => USER==='root' ? '/root' : '/home/'+USER;

function dirEntries(segs){
  if(!segs.length){
    const m=new Map();
    if(POSTS.length)    m.set('posts',{kind:'dir'});
    if(PROJECTS.length) m.set('projects',{kind:'dir'});
    if(TAGS().length)   m.set('tags',{kind:'dir'});
    m.set('info.txt',{kind:'doc',doc:'file:info.txt'});
    m.set('.zshrc',{kind:'doc',doc:'file:.zshrc'});
    m.set('.plan',{kind:'doc',doc:'file:.plan'});
    return m;
  }
  const [a,b]=segs;
  if(a==='posts' && segs.length===1 && POSTS.length)
    return new Map(POSTS.map(p=>[p.file,{kind:'post',post:p}]));
  if(a==='projects' && PROJECTS.length){
    if(segs.length===1) return new Map(PROJECTS.map(p=>[p.name,{kind:'projdir',proj:p}]));
    const p=PROJECTS.find(p=>p.name===b);
    if(p && segs.length===2) return new Map([['README.md',{kind:'project',proj:p}]]);
    return null;
  }
  if(a==='tags' && TAGS().length){
    if(segs.length===1) return new Map(TAGS().map(t=>[t,{kind:'dir'}]));
    if(TAGS().includes(b) && segs.length===2)
      return new Map(POSTS.filter(p=>p.tags.includes(b)).map(p=>[p.file,{kind:'post',post:p}]));
    return null;
  }
  return null;
}
function resolvePath(arg){
  let rest=arg, segs;
  if(rest==='~' || rest===HOMEABS()) return {segs:[]};
  if(rest.startsWith('~/')){ segs=[]; rest=rest.slice(2); }
  else if(rest.startsWith(HOMEABS()+'/')){ segs=[]; rest=rest.slice(HOMEABS().length+1); }
  else if(rest.startsWith('/')){ segs=[]; rest=rest.replace(/^\/+((home|root)\/[^/]+\/)?/, a=>a); }
  else segs=[...cwd];
  for(const part of rest.split('/')){
    if(!part || part==='.') continue;
    if(part==='..'){ segs.pop(); continue; }
    segs.push(part);
  }
  return {segs};
}
function nodeAt(segs){
  if(!segs.length) return {kind:'home'};
  const entries=dirEntries(segs.slice(0,-1));
  if(!entries) return null;
  return entries.get(segs[segs.length-1]) || null;
}
const isDirNode = n => n && (n.kind==='dir'||n.kind==='projdir');

const echoCmd   = t  =>{ line(promptHTML()+esc(t)); };

function render(){
  pbefore.textContent = lineText.slice(0,caret);
  pcursor.textContent = lineText[caret] || ' ';
  pafter.textContent  = caret<lineText.length ? lineText.slice(caret+1) : '';
  computeGhost();
}
function computeGhost(){
  ghost=''; comps=[];
  if(!MODE && caret===lineText.length && lineText){
    const tok = lineText.match(/[^ ]*$/)[0];
    if(tok===lineText){                                   /* first token: commands */
      comps = Object.keys(COMMANDS).filter(c=>c.startsWith(tok)&&c.length>tok.length)
              .sort().map(c=>({insert:c,name:c,dir:false}));
    } else {
      const cmd   = lineText.slice(0,lineText.length-tok.length).trim().split(/\s+/)[0];
      const slash = tok.lastIndexOf('/');
      const dirPart = slash>=0 ? tok.slice(0,slash+1) : '';
      const base    = slash>=0 ? tok.slice(slash+1)   : tok;
      if(cmd==='curl'){                                   /* curl completes its own URLs */
        comps = ['ifconfig.co','ifconfig.co/json','ifconfig.co/all']
          .filter(t=>t.startsWith(tok))
          .map(t=>({insert:t,name:t,dir:false}));
      } else {
        const entries = dirEntries(resolvePath(dirPart||'.').segs);
        if(entries){
          comps = [...entries.keys()]
            .filter(n=>n.startsWith(base) && (!n.startsWith('.')||base.startsWith('.')))
            .map(n=>({insert:dirPart+n+(isDirNode(entries.get(n))?'/':''), name:n,
                      dir:isDirNode(entries.get(n))}));
          if(cmd==='cd' && !dirPart)
            TAGS().forEach(t=>{ if(t.startsWith(base) && !entries.has(t)) comps.push({insert:t,name:t,dir:true}); });
          if(cmd==='open' && !dirPart)
            comps = PROJECTS.filter(p=>p.name.startsWith(base)).map(p=>({insert:p.name,name:p,dir:false}));
        }
      }
      comps = comps.filter(c=>c.insert.length>tok.length).sort((a,b)=>a.name.localeCompare(b.name));
    }
    ghost = comps.length ? comps[0].insert.slice(lineText.match(/[^ ]*$/)[0].length) : '';
  }
  pghost.textContent = ghost;
  if(ghost!==lastGhost){ lastGhost=ghost;
    pghost.classList.remove('flick'); void pghost.offsetWidth; pghost.classList.add('flick'); }
}
function insertText(t){
  const tok = lineText.match(/[^ ]*$/)[0];
  lineText = lineText.slice(0, lineText.length-tok.length) + t;
  caret = lineText.length;
  syncHid(); render();
}
function acceptGhost(){
  if(!comps.length) return;
  const tok = lineText.match(/[^ ]*$/)[0];
  if(comps.length===1){ insertText(comps[0].insert); blip(); return; }
  const pfx = comps.map(c=>c.insert).reduce((a,b)=>{
    let i=0; while(i<a.length && i<b.length && a[i]===b[i]) i++; return a.slice(0,i);
  });
  if(pfx.length>tok.length){ insertText(pfx); blip(); return; }
  line(comps.map(c=>esc(c.name+(c.dir?'/':''))).join('   '),'dim');
}

/* ── cursor & audio ──────────────────────────────────────────────────── */
let pokeT=null;
function pokeCursor(){
  pcursor.classList.add('solid');
  clearTimeout(pokeT);
  pokeT=setTimeout(()=>pcursor.classList.remove('solid'),700);

let AC=null, noiseBuf=null;
function ensureAC(){
  if(!sndOn) return null;
  try{
    if(!AC){
      const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
      AC=new C();
      noiseBuf=AC.createBuffer(1,2048,AC.sampleRate);
      const d=noiseBuf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    }
    if(AC.state==='suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}
function keyClick(pitch=1){
  const a=ensureAC(); if(!a) return; const t=a.currentTime;
  const s=a.createBufferSource(); s.buffer=noiseBuf;
  const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2300*pitch; f.Q.value=1.5;
  const g=a.createGain(); g.gain.setValueAtTime(.10,t); g.gain.exponentialRampToValueAtTime(.001,t+.05);
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t+.06);
}
function thunk(){
  const a=ensureAC(); if(!a) return; const t=a.currentTime;
  const o=a.createOscillator(); o.type='triangle'; o.frequency.value=150;
  const g=a.createGain(); g.gain.setValueAtTime(.08,t); g.gain.exponentialRampToValueAtTime(.001,t+.09);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+.1);
}
function blip(){
  const a=ensureAC(); if(!a) return; const t=a.currentTime;
  const o=a.createOscillator(); o.type='sine'; o.frequency.value=920;
  const g=a.createGain(); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.001,t+.035);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+.04);
}

const syncHid = ()=>{ hid.value=lineText; try{ hid.setSelectionRange(caret,caret); }catch(e){} };
function setLine(v){ lineText=v; caret=v.length; syncHid(); render(); }
function typeChar(ch){

function backspace(){

function histPrev(){

function histNext(){

function onKey(e){
  if(e.isComposing) return;
  if(e.target!==hid && (e.ctrlKey || e.metaKey || e.altKey)) return;
  if(busy){
    if(e.key.length===1 || e.key==='Enter'){ skipFlag=true; e.preventDefault(); }
    return;
  }
  if((e.ctrlKey || e.metaKey) && !(e.ctrlKey && e.altKey)){
    const k=e.key.toLowerCase();
    if(k==='c'){ e.preventDefault(); ctrlC(); return; }
    if(k==='l'){ e.preventDefault(); out.innerHTML=''; out.appendChild(promptline); return; }
    if(k==='u'){ e.preventDefault(); wipeLine(); return; }
    if(k==='a'){ e.preventDefault(); caret=0; syncHid(); render(); return; }
    if(k==='e'){ e.preventDefault(); caret=lineText.length; syncHid(); render(); return; }
    if(k==='d'){                                  /* EOF on empty line, like bash */
      e.preventDefault();
      if(MODE) return;
      if(!lineText){ endSession(); }
      else if(caret<lineText.length){
        lineText=lineText.slice(0,caret)+lineText.slice(caret+1);
        syncHid(); render();
      }
      return;
    }
    return;
  }
  switch(e.key){
    case 'Enter': case 'NumpadEnter':
      e.preventDefault(); thunk(); submit(); return;
    case 'Tab':
      e.preventDefault(); acceptGhost(); return;
    case 'ArrowUp':    e.preventDefault(); histPrev(); return;
    case 'ArrowDown':  e.preventDefault(); histNext(); return;
    case 'ArrowLeft':
      e.preventDefault(); if(caret>0){ caret--; syncHid(); render(); } return;
    case 'ArrowRight':
      e.preventDefault(); if(caret<lineText.length){ caret++; syncHid(); render(); } return;
    case 'Home': e.preventDefault(); caret=0; syncHid(); render(); return;
    case 'End':  e.preventDefault(); caret=lineText.length; syncHid(); render(); return;
    case 'Backspace': e.preventDefault(); backspace(); keyClick(.7); return;
    case 'Delete':
      e.preventDefault();
      if(caret<lineText.length){
        lineText=lineText.slice(0,caret)+lineText.slice(caret+1);
        syncHid(); render();
      }
      return;
    default:
      if(e.key.length===1){
        e.preventDefault();
        typeChar(e.key);
        keyClick(); pokeCursor();
      }
  }
}

/* ── tokenize / dispatch ─────────────────────────────────────────────── */
function tokenize(s){
  const outT=[]; let cur='', q=null, has=false;
  for(const ch of s){
    if(q){ if(ch===q) q=null; else cur+=ch; }
    else if(ch==='"'||ch==="'"){ q=ch; has=true; }
    else if(ch===' '||ch==='\t'){ if(cur||has){ outT.push(cur); cur=''; has=false; } }
    else cur+=ch;
  }
  if(cur||has) outT.push(cur);
  return outT;
}
function lev(a,b){
  if(Math.abs(a.length-b.length)>2) return 9;
  const dp=Array.from({length:a.length+1},(_,i)=>{ const r=new Array(b.length+1).fill(0); r[0]=i; return r; });
  for(let j=0;j<=b.length;j++) dp[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    dp[i][j]=Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return dp[a.length][b.length];
}
function suggest(w){
  let best=null, bd=3;
  for(const c of Object.keys(COMMANDS)){ const d=lev(w,c); if(d<bd){ bd=d; best=c; } }
  return best;
}
function execute(text){
  if(busy) return;
  if(text.includes('&&')){ text.split('&&').forEach(t=>{ if(t.trim()) execute(t.trim()); }); return; }
  const tokens=tokenize(text);
  if(!tokens.length) return;
  const cmd=tokens[0].toLowerCase(), args=tokens.slice(1);
  const rawRest=text.slice(text.indexOf(tokens[0])+tokens[0].length).replace(/^\s+/,'');
  const fn=COMMANDS[cmd];
  if(!fn){
    line(`bash: ${esc(tokens[0])}: command not found`,'err');
    const s=suggest(cmd);
    if(s) line(`did you mean '<span data-cmd="${s}">${s}</span>'? shells can't apologize, but they can guess`,'dim');
    return;
  }
  fn(args, rawRest);
}
function submit(){
  const text=lineText;
  echoCmd(text);
  lineText=''; caret=0; syncHid(); render();
  if(MODE){
    if(MODE.type==='mail') mailEnter(text);
    else loginEnter(text);
    return;
  }
  if(!text.trim()) return;
  if(HIST[HIST.length-1]!==text){
    HIST.push(text); if(HIST.length>200) HIST.shift();
    store.set('hist',HIST);
  }
  hIdx=null;
  execute(text);
}

function entryHTML(segs,name,node){
  const dir = pathStr(segs)==='~' ? '~' : pathStr(segs);
  const full = `${dir}/${name}`;
  if(isDirNode(node)) return `<span class="d" data-cmd="cd ${full}">${esc(name)}/</span>`;
  return `<span data-cmd="cat ${full}">${esc(name)}</span>`;
}
function docSize(nd){
  if(nd.kind==='post') return nd.post.md.length;
  if(nd.doc==='file:info.txt') return infoTxtSize();
  return (DOCS[nd.doc]?.text||'').length||0;
}
function cmdLs(args){
  const flags=(args.filter(a=>a.startsWith('-')).join(''))||'';
  const target=args.find(a=>!a.startsWith('-'))||'.';
  const r=resolvePath(target), node=nodeAt(r.segs);
  if(!node){ line(`ls: cannot access '${esc(target)}': No such file or directory`,'err'); return; }
  if(!(node.kind==='dir'||node.kind==='home'||node.kind==='projdir')){
    line(entryHTML(r.segs, r.segs[r.segs.length-1], node)); return;
  }
  const entries=dirEntries(r.segs);
  let names=[...entries.keys()];
  if(!flags.includes('a')) names=names.filter(n=>!n.startsWith('.'));
  names.sort((a,b)=>{
    const da=isDirNode(entries.get(a)), db=isDirNode(entries.get(b));
    return da!==db ? (da?-1:1) : a.localeCompare(b);
  });
  if(!names.length){ line(''); return; }
  if(flags.includes('l')){
    let total=0;
    for(const n of names){
      const nd=entries.get(n), d=isDirNode(nd);
      const size=d?4096:docSize(nd);
      total+=Math.max(1,Math.ceil(size/1024));
    }
    line(`total ${total}`);
    for(const n of names){
      const nd=entries.get(n), d=isDirNode(nd);
      const perm=d?'drwxr-xr-x':'-rw-r--r--';
      const size=d?4096:docSize(nd);
      const date=d?lsDate(''):lsDate(nd.kind==='post'?nd.post.date:undefined);
      line(`<span class="dim">${perm}</span>  1 ${USER} ${USER} ${String(size).padStart(6)} ${date}  ${entryHTML(r.segs,n,nd)}`);
    }
    return;
  }
  const wmax=Math.max(...names.map(n=>n.length+(isDirNode(entries.get(n))?1:0)));
  let ncols=Math.floor(((scrollEl.clientWidth||600)-28)/(CH*(wmax+2)));
  ncols=Math.min(Math.max(ncols,1),8);
  for(let i=0;i<names.length;i+=ncols){
    const row=names.slice(i,i+ncols).map(n=>{
      const nd=entries.get(n);
      return entryHTML(r.segs,n,nd)+' '.repeat(wmax+2-(n.length+(isDirNode(nd)?1:0)));
    }).join('');
    line(row);
  }
}

/* ── curl — the one honest packet in this whole fake terminal ────────── */
async function httpGet(url, ms=6500){
  const opt={};
  try{
    if(typeof AbortSignal!=='undefined' && typeof AbortSignal.timeout==='function')
      opt.signal=AbortSignal.timeout(ms);
  }catch(e){}
  const r=await fetch(url,opt);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return await r.text();
}
async function cmdCurl(args){
  if(args.includes('--help')||args.includes('-h')){
    line('mini-curl — browser-grown, CORS-fed','dim');
    line('  curl                    your ip + info, live from ifconfig.co');
    line('  curl ifconfig.co        just the ip (the authentic one-liner)');
    line('  curl ifconfig.co/json   the raw json');
    line('  curl ifconfig.co/all    the info card');
    line('  curl -I <url>           response headers (CORS-friendly hosts)');
    line('  curl <url>              dump the body — first 2 KB');
    return;
  }
  const flags=args.filter(a=>a.startsWith('-')).join('').toLowerCase();
  const urls =args.filter(a=>!a.startsWith('-'));
  const target=(urls[0]||'').replace(/^["']|["']$/g,'').replace(/\/+$/,'');
  if(!target){
    line("curl: no URL given — defaulting to ifconfig.co, house rules",'dim');
    await showIPInfo('all');
    return;
  }
  const bareHost=target.replace(/^https?:\/\//i,'');
  if(/^(www\.)?ifconfig\.(co|me)(\/(json|all|ip)?)?$/i.test(bareHost)){
    const path=bareHost.replace(/^(www\.)?ifconfig\.(co|me)/i,'');
    if(/json/i.test(path)){ await showIPInfo('json'); return; }
    if(/all/i.test(path)){ await showIPInfo('all'); return; }
    await showIPInfo('plain');
    return;
  }
  const url=/^https?:\/\//i.test(target)?target:'https://'+target;
  if(flags.includes('i')){
    try{
      const r=await fetch(url,{method:'HEAD'});
      line(`HTTP/2 ${r.status}`);
      ['content-type','server','content-length','date'].forEach(k=>{
        const v=r.headers.get(k); if(v) line(`${k}: ${esc(v)}`,'dim');
      });
    }catch(e){
      line(`curl: (7) couldn't connect to ${esc(bareHost)} — CORS walls, most likely`,'err');
    }
    return;
  }
  try{
    const t=await httpGet(url);
    if(t.length>2000){
      line(esc(t.slice(0,2000)));
      line(`… ${t.length-2000} more bytes truncated (this curl is on a diet)`,'dim');
    } else {
      line(t?esc(t):'(empty response)');
    }
  }catch(e){
    line(`curl: (7) couldn't connect to ${esc(bareHost)} — CORS walls, most likely. this curl reaches CORS-friendly endpoints only.`,'err');
  }
}
async function showIPInfo(mode){
  let cline=null, iv=null, dots=0;
  if(mode!=='plain'){
    cline=line('connecting to ifconfig.co','dim');
    if(!RM) iv=setInterval(()=>{ cline.textContent='connecting to ifconfig.co'+'.'.repeat(dots=(dots+1)%4); },260);
  }
  const stop=(word)=>{ if(iv) clearInterval(iv); if(cline) cline.textContent='connecting to ifconfig.co — '+word; };

  let info=null, source='ifconfig.co';
  try{
    const d=JSON.parse(await httpGet('https://ifconfig.co/json'));
    info={
      ip:d.ip, hostname:d.hostname||null,
      city:d.city||null, region:d.region||null,
      country:d.country_name||d.country||null,
      org:d.org||(d.asn&&d.asn.name?('AS'+d.asn.asn+' '+d.asn.name):null),
      timezone:d.timezone||null, obj:d
    };
  }catch(e){}
  if(!info){
    source='ipwho.is (backup)';
    try{
      const d=JSON.parse(await httpGet('https://ipwho.is/'));
      if(d && d.ip){
        info={
          ip:d.ip, hostname:null,
          city:d.city||null, region:d.region||null, country:d.country||null,
          org:(d.connection&&d.connection.org)?('AS'+(d.connection.asn||'?')+' '+d.connection.org):null,
          timezone:(d.timezone&&d.timezone.id)||null, obj:d
        };
      }
    }catch(e){}
  }
  if(!info){
    try{
      const d=JSON.parse(await httpGet('https://api.ipify.org?format=json'));
      stop('answered');
      line(esc(d.ip));
      line('(geo lookup failed — but your ip is your ip)','dim');
    }catch(e){
      stop('failed');
      line("curl: (7) couldn't reach ifconfig.co — either it's down, or you're impressively offline",'err');
    }
    return;
  }
  stop('answered');
  if(mode==='plain'){ line(esc(info.ip)); return; }
  if(mode==='json'){
    line(esc(JSON.stringify(info.obj,null,2)));
    line('(piped through a very small jq)','dim');
    return;
  }
  const kv=(k,v,note)=>{
    const s=(v==null||v==='')?'—':String(v);
    line(`  <span class="dim">${k.padEnd(10)}</span>${esc(s)}${note?`  <span class="dim">${note}</span>`:''}`);
  };
  sect('ifconfig.co — who is asking');
  kv('user ip', info.ip, '← that would be you');
  kv('hostname', info.hostname);
  kv('city', info.city);
  kv('region', info.region);
  kv('country', info.country);
  kv('org', info.org);
  kv('timezone', info.timezone);
  line('  <span class="dim">source: '+source+' · live lookup · nothing stored on this end</span>');
}

/* ── mailx-style composer ────────────────────────────────────────────── */
function startComposer(addr){
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(addr)){
    line(`mail: '${esc(addr)}' doesn't look deliverable — aspirational, maybe`,'err'); return;
  }
  MODE={type:'mail', to:addr, step:'subject', subject:'', body:[], label:'Subject: '};
  line(`mail — composing to ${esc(addr)}  (Ctrl+C to bail)`,'dim');
  setPrompt();
}
function mailEnter(text){
  if(MODE.step==='subject'){
    MODE.subject=text||'(no subject)';
    MODE.step='body'; MODE.label='';
    line(`(body — finish with a single '.' on its own line, like it's 1987)`,'dim');
    setPrompt();
    return;
  }
  if(text.trim()==='.'){ finishMail(); return; }
  MODE.body.push(text);
}
function finishMail(){
  const m=MODE; MODE=null; setPrompt();
  const body=m.body.join('\n');
  const url=`mailto:${m.to}?subject=${encodeURIComponent(m.subject)}&body=${encodeURIComponent(body)}`;
  line('');
  line('── draft ──────────────────────','dim');
  line(`to:      ${esc(m.to)}`);
  line(`subject: ${esc(m.subject)}`);
  line(`body:    ${m.body.length} line${m.body.length===1?'':'s'}`);
  line('───────────────────────────────','dim');
  try{ navigator.clipboard && navigator.clipboard.writeText(`${m.to}\nSubject: ${m.subject}\n\n${body}`); }catch(e){}
  line('>> handed off to your mail client — a copy is on your clipboard, just in case','dim');
  setTimeout(()=>{ window.location.href=url; },350);
}

    ? "you're already root. that's the whole problem."
    : `${USER} is not in the sudoers file. This incident will be reported to absolutely no one.`,'err'),
  rm:a=>line(`rm: cannot remove '${esc(a.join(' ')||'~')}': Read-only file system (nice try though)`,'err'),
  vim:()=>line("you're already three shells deep. one more and we all fall in.",'dim'),
  vi:()=>line("you're already three shells deep. one more and we all fall in.",'dim'),
  emacs:()=>line("emacs: not installed — this tty tops out at 640K. (great editor though. relax.)",'dim'),
  ':q':()=>line("this isn't vim. I know. disappointing.",'dim'),
};

/* ── metrics ─────────────────────────────────────────────────────────── */
function metrics(){
  const s=document.createElement('span');
  s.textContent='0'.repeat(20);
  s.style.cssText='position:absolute;visibility:hidden;white-space:pre';
  scrollEl.appendChild(s);
  CH=s.getBoundingClientRect().width/20||7.2;
  s.remove();
  COLS=Math.max(24,Math.floor(((scrollEl.clientWidth||600)-28)/CH));
}

/* ── boot — a fresh tty, asking who's there (from the very top) ──────── */
function boot(){
  startLogin();
  if(!TOUCH) hid.focus({preventScroll:true});
}

/* ── init ────────────────────────────────────────────────────────────── */
scrollEl.appendChild(out);
out.appendChild(promptline);     /* the live prompt, in the flow */

let th=store.get('theme','linux');
if(!store.get('v13',false)){
  /* one-time migration to the linux look */
  if(th==='green') th='linux';
  store.set('v13',1);
  store.set('crt',false);
}
applyTheme(th);
setCrt(store.get('crt',false));
sndOn=!!store.get('snd',false);
render();
metrics();
window.addEventListener('resize',metrics);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(metrics);
resolveMyIP();                   /* know who's asking, before they ask */
boot();
</script>
</body>
</html>
